<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SMS Logger</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/postmonger/postmonger.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            color: #333;
            background: #fff;
            font-size: 13px;
        }

        h3 {
            color: #2e7d32;
            margin-bottom: 16px;
            font-size: 15px;
            text-align: center;
        }

        .field {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            color: #444;
            font-size: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            background: #fff;
        }

        .hint {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }

        .badge {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 11px;
            color: #2e7d32;
            margin-left: 6px;
        }
    </style>
</head>

<body>

<h3>
    📱 SMS Logger
    <span class="badge">Active</span>
</h3>

<div class="field">
    <label>Mobile Number</label>
    <input type="text" id="mobileNumber" />
    <div class="hint">Journey attribute for mobile number</div>
</div>

<div class="field">
    <label>Lead ID</label>
    <input type="text" id="leadId" />
    <div class="hint">Journey attribute for lead ID</div>
</div>

<div class="field">
    <label>Application ID</label>
    <input type="text" id="applicationId" />
    <div class="hint">Journey attribute for application ID</div>
</div>

<div class="field">
    <label>Source</label>

    <select id="source">
        <option value="Journey">Journey</option>
        <option value="API">API</option>
        <option value="Manual">Manual</option>
        <option value="Campaign">Campaign</option>
    </select>

    <div class="hint">
        Source identifier for this log entry
    </div>
</div>

<script>

    var connection = new Postmonger.Session();
    var payload = {};

    $(window).ready(function () {

        connection.on('initActivity', initialize);

        connection.on('clickedNext', save);

        connection.trigger('ready');
    });

    function initialize(data) {

    if (data) {
        payload = data;
    }

    var args = {};

    try {

        if (
            payload.arguments &&
            payload.arguments.execute &&
            payload.arguments.execute.inArguments
        ) {

            payload.arguments.execute.inArguments.forEach(function(obj) {

                var key = Object.keys(obj)[0];

                args[key] = obj[key];
            });
        }

        $('#mobileNumber').val(
            args.mobileNumber ||
            '{{Event.B405B07A-6C45-4AD6-8F3F-887A4BE96782.MobileNumber}}'
        );

        $('#leadId').val(
            args.leadId ||
            '{{Event.B405B07A-6C45-4AD6-8F3F-887A4BE96782.LeadId}}'
        );

        $('#applicationId').val(
            args.applicationId ||
            '{{Event.B405B07A-6C45-4AD6-8F3F-887A4BE96782.ApplicationId}}'
        );

        $('#source').val(
            args.source || 'Journey'
        );

    } catch (e) {

        $('#mobileNumber').val('{{Event.B405B07A-6C45-4AD6-8F3F-887A4BE96782.MobileNumber}}');

        $('#leadId').val('{{Event.B405B07A-6C45-4AD6-8F3F-887A4BE96782.LeadId}}');

        $('#applicationId').val('{{Event.B405B07A-6C45-4AD6-8F3F-887A4BE96782.ApplicationId}}');

        $('#source').val('Journey');
    }
}

   function save() {

    payload.metaData.isConfigured = true;

    payload.arguments.execute.inArguments = [

        { "subscriberKey": "{{Contact.Key}}" },

        { "mobileNumber": $('#mobileNumber').val() },

        { "leadId": $('#leadId').val() },

        { "applicationId": $('#applicationId').val() },

        { "journeyId": "{{Context.InteractionId}}" },

        { "activityId": "{{Activity.Id}}" },

        { "source": $('#source').val() }

    ];

    connection.trigger('updateActivity', payload);
}

</script>

</body>
</html>
