<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SMS Logger</title>
    <script src="https://cdn.jsdelivr.net/npm/postmonger@0.0.16/postmonger.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
            color: #333;
            background: #fff;
        }
        h3 { color: #2e7d32; }
        p { font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <h3>✅ SMS Logger Active</h3>
    <p>This activity automatically logs SMS data.<br>Click <strong>Done</strong> to save.</p>

    <script>
        var connection = new Postmonger.Session();
        var ready = false;

        function triggerReady() {
            if (!ready) {
                ready = true;
                connection.trigger('ready');
            }
        }

        connection.on('initActivity', function(data) {
            triggerReady();
        });

        connection.on('clickedNext', function() { save(); });
        connection.on('clickedDone', function() { save(); });

        function save() {
            connection.trigger('updateActivity', {
                metaData: { isConfigured: true },
                "arguments": {
                    "execute": {
                        "inArguments": [{
                            "subscriberKey":  "{{Contact.Key}}",
                            "mobileNumber":   "{{Event.MobileNumber}}",
                            "leadId":         "{{Event.LeadId}}",
                            "applicationId":  "{{Event.ApplicationId}}",
                            "journeyId":      "{{Context.InteractionId}}",
                            "journeyVersion": "{{Context.InteractionVersionId}}",
                            "activityName":   "{{Context.ActivityId}}",
                            "messageKey":     "{{Context.ActivityInstanceId}}",
                            "source":         "Journey"
                        }],
                        "outArguments": []
                    }
                }
            });
        }

        setTimeout(function() { triggerReady(); }, 1000);
    </script>
</body>
</html>
