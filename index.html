<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SMS Logger</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/postmonger/0.0.14/postmonger.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            text-align: center;
            color: #333;
            background: #fff;
            margin: 0;
        }
        h3 { color: #2e7d32; }
        p { font-size: 14px; }
    </style>
</head>
<body>
    <h3>✅ SMS Logger Active</h3>
    <p>Logs SMS data into <strong>SendLogMasterSMS</strong>.<br>Click <strong>Done</strong> to save.</p>

    <script>
        var connection = new Postmonger.Session();
        var ready = false;

        function triggerReady() {
            if (!ready) {
                ready = true;
                connection.trigger('ready');
            }
        }

        function save() {
            connection.trigger('updateActivity', {
                metaData: { isConfigured: true },
                "arguments": {
                    "execute": {
                        "inArguments": [{
                            "subscriberKey": "{{Contact.Key}}",
                            "mobileNumber": "{{Event.MobileNumber}}",
                            "leadId": "{{Event.LeadId}}",
                            "applicationId": "{{Event.ApplicationId}}",
                            "journeyId": "{{Context.InteractionId}}",
                            "journeyVersion": "{{Context.InteractionVersionId}}",
                            "activityName": "{{Context.ActivityId}}",
                            "messageKey": "{{Context.ActivityInstanceId}}",
                            "source": "Journey"
                        }],
                        "outArguments": []
                    }
                }
            });
        }

        connection.on('initActivity', function() { triggerReady(); });
        connection.on('clickedNext', function() { save(); });
        connection.on('clickedDone', function() { save(); });

        // Fire ready immediately — don't wait for initActivity
        triggerReady();
    </script>
</body>
</html>
