<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SMS Logger</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/postmonger/0.0.14/postmonger.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            text-align: center;
            color: #333;
            background: #fff;
        }
        h3 { color: #007bff; }
        p { font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>
    <h3>✅ SMS Logger Active</h3>
    <p>This activity automatically logs SMS data into <strong>SendLogMasterSMS</strong>.<br>Click <strong>Done</strong> to save.</p>

    <script>
        var connection = new Postmonger.Session();
        var initialized = false;

        // Wait for Journey Builder to be ready first
        connection.on('initActivity', function(data) {
            if (!initialized) {
                initialized = true;
                // Tell JB the activity is ready
                connection.trigger('ready');
            }
        });

        // When user clicks Done button
        connection.on('clickedNext', function() {
            connection.trigger('updateActivity', {
                metaData: { isConfigured: true }
            });
        });

        // Also handle clickedDone (some JB versions use this)
        connection.on('clickedDone', function() {
            connection.trigger('updateActivity', {
                metaData: { isConfigured: true }
            });
        });

        // Trigger ready after a short delay as fallback
        setTimeout(function() {
            if (!initialized) {
                initialized = true;
                connection.trigger('ready');
            }
        }, 500);
    </script>
</body>
</html>
