<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SMS Logger</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/postmonger/postmonger.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; padding: 20px; color: #333; background: #fff; font-size: 13px; }
        h3 { color: #2e7d32; margin-bottom: 16px; font-size: 15px; text-align: center; }
        .info { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 4px; padding: 10px; font-size: 12px; color: #2e7d32; }
        .badge { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 12px; padding: 3px 10px; font-size: 11px; color: #2e7d32; margin-left: 6px; }
    </style>
</head>
<body>

<h3>
    📱 SMS Logger
    <span class="badge">Hardcoded Test Mode</span>
</h3>

<div class="info">
    This activity uses hardcoded test values for debugging.<br><br>
    <strong>subscriberKey:</strong> {{Contact.Key}}<br>
    <strong>mobileNumber:</strong> TEST_HARDCODED_MOBILE<br>
    <strong>leadId:</strong> TEST_LEAD<br>
    <strong>applicationId:</strong> TEST_APP<br>
    <strong>source:</strong> Journey
</div>

<script>
    var connection = new Postmonger.Session();
    var payload = {};

    $(window).ready(function () {
        connection.on('initActivity', initialize);
        connection.on('clickedNext', save);
        connection.trigger('ready');
    });

    function initialize(data) {
        if (data) { payload = data; }
    }

    function save() {
        payload.metaData.isConfigured = true;

        payload.arguments.execute.inArguments = [
            {
                subscriberKey: '{{Contact.Key}}',
                mobileNumber: 'TEST_HARDCODED_MOBILE',
                leadId: 'TEST_LEAD',
                applicationId: 'TEST_APP',
                journeyId: '{{Context.InteractionId}}',
                journeyVersion: '{{Context.InteractionVersionId}}',
                activityName: '{{Context.ActivityId}}',
                messageKey: '{{Context.ActivityInstanceId}}',
                source: 'Journey'
            }
        ];

        connection.trigger('updateActivity', payload);
    }
</script>

</body>
</html>
