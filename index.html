<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SMS Logger</title>
    <script src="postmonger.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; padding: 20px; color: #333; background: #fff; font-size: 13px; }
        h3 { color: #2e7d32; margin-bottom: 16px; font-size: 15px; text-align: center; }
        .field { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #444; font-size: 12px; }
        input, select { width: 100%; padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; color: #333; background: #fff; }
        input:focus, select:focus { outline: none; border-color: #2e7d32; }
        .hint { font-size: 11px; color: #888; margin-top: 3px; }
        .badge { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 12px; padding: 3px 10px; font-size: 11px; color: #2e7d32; margin-left: 6px; }
    </style>
</head>
<body>
    <h3>📱 SMS Logger <span class="badge">Active</span></h3>

    <div class="field">
        <label>Mobile Number</label>
        <input type="text" id="mobileNumber" />
        <div class="hint">Journey attribute for mobile number</div>
    </div>
    <div class="field">
        <label>Lead ID</label>
        <input type="text" id="leadId" />
        <div class="hint">Journey attribute for lead ID</div>
    </div>
    <div class="field">
        <label>Application ID</label>
        <input type="text" id="applicationId" />
        <div class="hint">Journey attribute for application ID</div>
    </div>
    <div class="field">
        <label>Source</label>
        <select id="source">
            <option value="Journey">Journey</option>
            <option value="API">API</option>
            <option value="Manual">Manual</option>
            <option value="Campaign">Campaign</option>
        </select>
        <div class="hint">Source identifier for this log entry</div>
    </div>

    <script>
        var connection = new Postmonger.Session();
        var payload = {};

        // Per SF docs: call ready on page load
        // JB responds with initActivity
        connection.trigger('ready');

        connection.on('initActivity', function(data) {
            if (data) { payload = data; }

            try {
                var args = payload.arguments.execute.inArguments[0];
                document.getElementById('mobileNumber').value  = args.mobileNumber  || '{{Event.MobileNumber}}';
                document.getElementById('leadId').value        = args.leadId        || '{{Event.LeadId}}';
                document.getElementById('applicationId').value = args.applicationId || '{{Event.ApplicationId}}';
                var sel = document.getElementById('source');
                var src = args.source || 'Journey';
                for (var i = 0; i < sel.options.length; i++) {
                    if (sel.options[i].value === src) { sel.selectedIndex = i; break; }
                }
            } catch(e) {
                document.getElementById('mobileNumber').value  = '{{Event.MobileNumber}}';
                document.getElementById('leadId').value        = '{{Event.LeadId}}';
                document.getElementById('applicationId').value = '{{Event.ApplicationId}}';
            }
        });

        // Per SF docs: respond to clickedNext with updateActivity
        connection.on('clickedNext', function() {
            payload.metaData = payload.metaData || {};
            payload.metaData.isConfigured = true;
            payload.arguments = payload.arguments || {};
            payload.arguments.execute = payload.arguments.execute || {};
            payload.arguments.execute.inArguments = [{
                subscriberKey:  '{{Contact.Key}}',
                mobileNumber:   document.getElementById('mobileNumber').value   || '{{Event.MobileNumber}}',
                leadId:         document.getElementById('leadId').value          || '{{Event.LeadId}}',
                applicationId:  document.getElementById('applicationId').value   || '{{Event.ApplicationId}}',
                journeyId:      '{{Context.InteractionId}}',
                journeyVersion: '{{Context.InteractionVersionId}}',
                activityName:   '{{Context.ActivityId}}',
                messageKey:     '{{Context.ActivityInstanceId}}',
                source:         document.getElementById('source').value          || 'Journey'
            }];
            connection.trigger('updateActivity', payload);
        });
    </script>
</body>
</html>
